<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Cadastro de Professor</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div class="container formulario">

    <h1
        th:text="${professor.id == null ? 'Novo Professor' : 'Editar Professor'}">
        Professor
    </h1>

    <form
        th:action="@{/professores/salvar}"
        th:object="${professor}"
        method="post">

        <input
            type="hidden"
            th:field="*{id}">

        <div class="campo">

            <label for="nome">Nome:</label>

            <input
                type="text"
                id="nome"
                th:field="*{nome}"
                placeholder="Digite o nome do professor"
                required>

        </div>

        <div class="campo">

            <label for="email">E-mail:</label>

            <input
                type="email"
                id="email"
                th:field="*{email}"
                placeholder="Digite o e-mail do professor"
                required>

        </div>

        <div class="botoes">

            <button
                type="submit"
                class="botao">

                Salvar

            </button>

            <a
                href="/professores"
                class="botao cinza">

                Cancelar

            </a>

        </div>

    </form>

</div>

</body>
</html>
